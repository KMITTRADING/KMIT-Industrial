name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · gates · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Locale parity
        run: npm run check:i18n

      - name: Physical-direction gate
        run: npm run check:direction

      - name: Copy gate
        run: npm run check:copy

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # The real origin is set per environment. CI only needs a well-formed
          # absolute URL so src/lib/env.ts validates and the build is
          # reproducible.
          NEXT_PUBLIC_SITE_URL: https://ci.invalid

      - name: Accessibility audit
        # Runs against the real server output rather than against source, which
        # is what catches a page shipping two h1 elements because two components
        # each thought they owned the page heading.
        run: |
          npx next start -p 3210 &
          npx wait-on --timeout 60000 http://localhost:3210/ar
          npm run audit:a11y -- http://localhost:3210
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
