# Netlify evaluates these rules at the edge, before serving a file. That is what
# lets the site be a pure static export and still answer `/` with a real 301
# rather than a meta-refresh stub.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Arabic is the default language (brief §8 leaves the choice open; the audience
# is Saudi B2B). `force` matters: without it Netlify would serve a generated
# out/index.html in preference to the rule.
[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

# The two fingerprinted asset directories are immutable; everything else is
# revalidated. The font files are not fingerprinted, so they get a shorter life
# with revalidation rather than a year of staleness.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
